name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy to Server
        run: |
          cd /var/www/gogmgo.com

          # Update source
          git fetch origin main
          git reset --hard origin/main

          # Fix Prisma provider
          sed -i 's/provider = "sqlite"/provider = "postgresql"/g' prisma/schema.prisma

          # Build on server
          npm install
          npx prisma generate
          npm run build

          # Restart app
          pm2 reload gogmgo || pm2 start npm --name "gogmgo" -- start
          pm2 save
